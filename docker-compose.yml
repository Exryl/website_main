services:
  web:
    image: nginx:1.27-alpine
    container_name: mysite-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - webnet

  app:
    build: ./app
    container_name: mysite-app
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
